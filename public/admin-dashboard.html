<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - Maa Sharde Library</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-dashboard-page {
      padding: 26px 20px 60px;
      background: #f8f9fb;
      min-height: 100vh;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .admin-header h1 {
      margin: 0;
      font-size: 30px;
      color: #0a192f;
    }
    .admin-dashboard-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .admin-btn {
      border: none;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: bold;
      background: #f5c542;
      color: #0a192f;
      cursor: pointer;
    }
    .admin-btn:hover { background: #f5a800; }
    .dashboard-stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 18px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: white;
      padding: 22px 20px;
      border-radius: 20px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.08);
    }
    .stat-card h3 { margin: 0 0 14px; color: #0a192f; font-size: 15px; }
    .stat-card p { font-size: 28px; font-weight: bold; margin: 0; }
    .dashboard-section {
      background: white;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 16px 50px rgba(0,0,0,0.07);
      margin-bottom: 28px;
    }
    .dashboard-section h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 22px;
      color: #0a192f;
    }
    .admin-form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .admin-form-row input,
    .admin-form-row select,
    .admin-form-row textarea {
      flex: 1 1 220px;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      font-size: 14px;
    }
    .admin-form-row textarea { height: 96px; resize: vertical; }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
    }
    .admin-table th,
    .admin-table td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #eef2f7;
      vertical-align: middle;
    }
    .admin-table th { color: #475569; font-size: 13px; text-transform: uppercase; letter-spacing: 0.03em; }
    .admin-table td { color: #0f172a; font-size: 14px; }
    .table-actions button {
      margin-right: 8px;
      margin-bottom: 6px;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      color: white;
    }
    .btn-edit { background: #0f172a; }
    .btn-approve { background: #16a34a; }
    .btn-reject { background: #dc2626; }
    .btn-delete { background: #8b5cf6; }
    .btn-view { background: #2563eb; }
    .admin-note { color: #475569; font-size: 13px; margin-top: 6px; }
    .admin-search-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .admin-search-row input,
    .admin-search-row select { min-width: 160px; }
    @media (max-width: 1100px) {
      .dashboard-stats { grid-template-columns: repeat(2, minmax(160px, 1fr)); }
    }
    @media (max-width: 700px) {
      .dashboard-stats { grid-template-columns: 1fr; }
      .admin-form-row, .admin-search-row { flex-direction: column; }
      .table-actions button { width: 100%; }
    }
  </style>
</head>
<body>
<section class="admin-dashboard-page" id="adminDashboardApp">
  <div class="admin-header">
    <div>
      <h1>Admin Dashboard</h1>
      <p id="adminStatusText" style="color:#475569; margin:6px 0 0; font-size:14px;"></p>
    </div>
    <div class="admin-dashboard-controls">
      <button class="admin-btn" id="refreshDashboardBtn">Refresh</button>
      <button class="admin-btn" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="dashboard-stats" id="dashboardStats"></div>

  <div class="dashboard-section" id="studentManagementSection">
    <h2>Student Management</h2>
    <div class="admin-search-row">
      <input type="text" id="studentSearchInput" placeholder="Search by name, email, mobile, ID" />
      <select id="studentAdmissionFilter">
        <option value="">All Admissions</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <select id="studentPaymentFilter">
        <option value="">All Payments</option>
        <option value="pending">Pending</option>
        <option value="verified">Verified</option>
        <option value="failed">Failed</option>
      </select>
      <input type="text" id="studentPlanFilter" placeholder="Plan filter" />
      <button class="admin-btn" id="studentFilterBtn">Filter</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="studentsTable"></table>
    </div>
  </div>

  <div class="dashboard-section" id="paymentManagementSection">
    <h2>Payment Requests</h2>
    <div class="admin-search-row">
      <input type="text" id="paymentSearchInput" placeholder="Search by payment ID" />
      <select id="paymentStatusFilter">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="under_verification">Under Verification</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <button class="admin-btn" id="paymentFilterBtn">Filter</button>
    </div>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="paymentsTable"></table>
    </div>
  </div>

  <div class="dashboard-section" id="planManagementSection">
    <h2>Membership Plans</h2>
    <form id="addPlanForm" class="admin-form-row">
      <input id="planTitle" placeholder="Plan Title" required />
      <input id="planPrice" type="number" min="0" placeholder="Price" required />
      <input id="planDuration" placeholder="Duration (e.g. Monthly)" required />
      <textarea id="planDescription" placeholder="Description"></textarea>
      <button class="admin-btn" type="submit">Add Plan</button>
    </form>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="plansTable"></table>
    </div>
  </div>

  <div class="dashboard-section" id="contactManagementSection">
    <h2>Contact Messages</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table" id="contactsTable"></table>
    </div>
  </div>
</section>
<script src="admin.js"></script>
</body>
</html>
